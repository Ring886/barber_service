server:
  port: 8080

spring:
  application:
    name: barber-booking-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/barber_booking?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:barber_booking}
    password: ${MYSQL_PASSWORD:barber_booking_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
